<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title_profile">Profile</title>
    <script>
        try {
            const raw = localStorage.getItem('rps_settings');
            if (raw) {
                const s = JSON.parse(raw);
                if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        
        * {
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        input, button, textarea, select {
            outline: none;
            border: none;
        }
        
        input:focus, button:focus, textarea:focus {
            outline: none;
            box-shadow: none;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
        }
        
        .profile-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
        }
        
        .profile-header-section {
            text-align: center;
            padding: 24px 16px;
            background: var(--card);
            color: var(--text);
            border: none;
        }
        
        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 20px auto 16px;
            border: none;
            border-radius: 50%;
            overflow: hidden;
            background: transparent;
        }
        
        .avatar-large {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .avatar-large-svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            color: var(--primary);
        }
        
        .username-text-profile {
            font-size: 18px;
            margin: 0;
            font-weight: 700;
            color: var(--text);
        }
        
        .referral-section {
            padding: 16px;
            background: transparent;
            margin: 12px 16px 0 16px;
            border-radius: 10px;
            box-shadow: none;
        }
        
        .referral-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .referral-link-box {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .referral-link-box input {
            flex: 1;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--card);
            color: var(--text);
        }
        
        .referral-link-box button {
            padding: 11px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        
        .referral-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .stat-box {
            background: var(--card);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .promo-section {
            padding: 16px;
            background: transparent;
            margin: 12px 16px 0 16px;
            border-radius: 10px;
            box-shadow: none;
        }
        
        .promo-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .promo-box {
            display: flex;
            gap: 6px;
        }
        
        .promo-box input {
            flex: 1;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--card);
            color: var(--text);
        }
        
        .promo-box button {
            padding: 11px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: var(--card);
            color: var(--text);
            border-radius: 14px;
            padding: 16px;
            width: 80%;
            max-width: 320px;
        }
    </style>
</head>
<body>
    <div id="notification-drawer" style="position:fixed;top:12px;left:8px;right:8px;z-index:10000;display:flex;flex-direction:column;pointer-events:none;align-items:center;"></div>
    <div class="app-container">
        <div class="profile-scroll-wrapper">
            <div class="profile-header-section">
                <div class="avatar-container">
                    <svg id="default-avatar" class="avatar-large-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <img id="tg-avatar-large" class="avatar-large" src="" style="display: none;">
                </div>
                <h2 id="tg-username-large" class="username-text-profile">User</h2>
            </div>

            <div class="settings-section">
                <div class="referral-section-title" data-i18n="settings_title">Settings</div>
                <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px;">
                    <div class="setting-row">
                        <div class="setting-title" data-i18n="theme">Theme</div>
                        <label class="switch">
                            <input id="theme-toggle" type="checkbox">
                            <span class="switch-slider"><span class="switch-knob"></span></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <div class="setting-title" data-i18n="language">Language</div>
                        <label class="switch">
                            <input id="language-toggle" type="checkbox">
                            <span class="switch-slider switch-slider-lang">
                                <span class="switch-label left">EN</span>
                                <span class="switch-label right">RU</span>
                                <span class="switch-knob"></span>
                            </span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <div class="setting-title" data-i18n="vibration">Vibration</div>
                        <label class="switch">
                            <input id="vibration-toggle" type="checkbox">
                            <span class="switch-slider"><span class="switch-knob"></span></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="promo-section">
                <div class="promo-section-title" data-i18n="promo_code">Promo Code</div>
                <div class="promo-box">
                    <input type="text" id="promo-field" data-i18n-placeholder="promo_field_placeholder" placeholder="Enter code">
                    <button onclick="submitPromo()" data-i18n="promo_use">Use</button>
                </div>
                <div id="promo-status" style="text-align: center; font-size: 13px; margin-top: 8px; display: none;"></div>
            </div>

            <div class="referral-section">
                <div class="referral-section-title" data-i18n="referral_link">Referral Code</div>
                <div class="referral-link-box" style="margin-top:12px;display:flex;gap:6px;align-items:center;">
                    <input id="referral-code" type="text" placeholder="Your code" style="flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);">
                    <button onclick="copyReferralCode()" data-i18n="copy" style="padding:11px 12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">Copy</button>
                    <button onclick="saveReferralCode()" data-i18n="save" style="padding:11px 12px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">Save</button>
                </div>
                <div class="referral-stats" style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div class="stat-box">
                        <div class="stat-label" data-i18n="referrals">Referrals</div>
                        <div class="stat-value" id="referrals-count">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label" data-i18n="earnings">Earnings</div>
                        <div class="stat-value" id="referral-earnings">0.0</div>
                    </div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </a>
            <a href="/market" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M3 9H21L19 20H5L3 9Z"></path><path d="M8 9V6C8 4.34315 9.34315 3 11 3H13C14.6569 3 16 4.34315 16 6V9"></path></svg>
            </a>
            <a href="/crafts" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            </a>
            <a href="/profile" class="nav-item active">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
            <a href="/inventory" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><circle cx="8" cy="14" r="1.5"></circle><circle cx="16" cy="14" r="1.5"></circle></svg>
            </a>
        </nav>
    </div>

    <div id="promo-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0;">Promo Code</h3>
                <button class="modal-close" onclick="closePromo()" aria-label="Close">×</button>
            </div>
            <div id="promo-status-modal" style="text-align: center; font-size: 12px; margin-bottom: 12px;"></div>
        </div>
    </div>

    <div id="gift-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="gift-modal-name" style="margin: 0;">Gift</h3>
                <button class="modal-close" onclick="closeGiftModal()" aria-label="Close">×</button>
            </div>
            <img id="gift-modal-image" src="" style="width: 100px; height: 100px; margin: 16px auto; object-fit: contain; display: block;">
            <p style="font-size: 16px; font-weight: bold; color: var(--primary); margin: 12px 0;" id="gift-modal-price">0.0 TON</p>
            <button onclick="sellSingleGift()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;">
                Sell for <span id="gift-modal-sell-price">0.0</span> TON
            </button>
        </div>
    </div>

    <!-- Top-up Modal -->
    <div id="topup-modal" class="modal-overlay" style="position: fixed; bottom: 0; left: 0; right: 0; top: 0; width: 100%; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 1000; padding: 0;">
        <div class="modal-content" style="background: var(--card); color: var(--text); border-radius: 24px 24px 0 0; padding: 24px 20px 20px; width: 100%; max-width: 100%; text-align: center; max-height: 80vh; overflow-y: auto; box-shadow: 0 -4px 24px rgba(0,0,0,0.25); animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">Пополнить баланс</h2>
                <button class="modal-close" onclick="closeTopupModal()" aria-label="Close" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0; transition: color 0.2s; border-radius: 8px;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-light)'">×</button>
            </div>
            
            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <!-- TON Button -->
                <button onclick="selectTopupMethod('ton')" id="ton-topup-btn" disabled style="flex: 1; padding: 16px 12px; background: #cccccc; border: 2px solid #999999; border-radius: 14px; cursor: not-allowed; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: all 0.2s; color: #666666; box-shadow: none; opacity: 0.6;">
                    <img src="/static/img/ton.png" style="width: 40px; height: 40px; object-fit: contain; opacity: 0.6;">
                    <div style="font-size: 14px; font-weight: 800;">TON</div>
                    <div style="font-size: 12px; font-weight: 500;">Недоступно</div>
                </button>
                
                <!-- Stars Button -->
                <button onclick="selectTopupMethod('stars')" id="stars-topup-btn" style="flex: 1; padding: 16px 12px; background: var(--card); border: 2px solid var(--border); border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: all 0.2s; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <img src="/static/img/star.png" style="width: 40px; height: 40px; object-fit: contain;">
                    <div style="font-size: 14px; font-weight: 800; color: var(--text);">Telegram Stars</div>
                    <div style="font-size: 12px; color: var(--text-light); font-weight: 500;">1 звезда</div>
                </button>
            </div>
            
            <!-- Amount Input -->
            <div id="topup-amount-section" style="display: none; margin-bottom: 24px;">
                <label style="font-size: 13px; color: var(--text-light); margin-bottom: 10px; display: block; text-align: left; font-weight: 600; letter-spacing: 0.3px;">Сумма:</label>
                <input type="number" id="topup-amount-input" placeholder="1" min="1" step="1" style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600; transition: border-color 0.2s; box-sizing: border-box;" onpaste="return false" oncopy="return false">
            </div>
            
            <!-- Confirm Button -->
            <button id="topup-confirm-btn" onclick="confirmTopup()" style="display: none; width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), rgba(0,100,200,0.8)); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(0,100,200,0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(0,100,200,0.4)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(0,100,200,0.3)';">
                Пополнить баланс
            </button>
        </div>
    </div>
    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #topup-amount-input::-webkit-outer-spin-button,
        #topup-amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #topup-amount-input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        #topup-amount-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,100,200,0.1);
        }
        #topup-amount-input::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }
    </style>

    <script>
        let currentInventory = [];
        let selectedGiftForSale = null;

        async function handleConnectWallet() {
            console.log('[PROFILE] Connect wallet clicked');
            try {
                if (typeof TonConnect !== 'undefined' && typeof TonConnect.openModal === 'function') {
                    await TonConnect.openModal();
                } else {
                    showNotification('TonConnect не инициализирован', 'error');
                }
            } catch (error) {
                console.error('[PROFILE] Connect wallet error:', error);
                if (!error.message.includes('user')) {
                    showNotification('Ошибка: ' + error.message, 'error');
                }
            }
        }

        // ===== TOP-UP MODAL FUNCTIONS =====
        let selectedTopupMethod = 'ton';

        function openTopupModal() {
            document.getElementById('topup-modal').style.display = 'flex';
            selectedTopupMethod = 'stars';
            updateTopupUI();
        }

        function closeTopupModal() {
            document.getElementById('topup-modal').style.display = 'none';
            document.getElementById('topup-amount-section').style.display = 'none';
            document.getElementById('topup-confirm-btn').style.display = 'none';
        }

        function resetTopupForm() {
            selectedTopupMethod = 'stars';
            const tonBtn = document.getElementById('ton-topup-btn');
            const starsBtn = document.getElementById('stars-topup-btn');
            tonBtn.style.background = '#cccccc';
            tonBtn.style.borderColor = '#999999';
            starsBtn.style.background = 'linear-gradient(135deg, #FFD700, rgba(255,215,0,0.2))';
            starsBtn.style.borderColor = '#FFD700';
            document.getElementById('topup-amount-section').style.display = 'none';
            document.getElementById('topup-confirm-btn').style.display = 'none';
            document.getElementById('topup-amount-input').value = '';
        }
        
        function updateTopupUI() {
            const starsBtn = document.getElementById('stars-topup-btn');
            const input = document.getElementById('topup-amount-input');
            
            // Setup for Stars
            starsBtn.style.background = 'linear-gradient(135deg, #FFD700, rgba(255,215,0,0.2))';
            starsBtn.style.borderColor = '#FFD700';
            
            input.type = 'number';
            input.step = '1';
            input.min = '1';
            input.value = '';
            input.placeholder = '1';
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
            
            document.getElementById('topup-amount-section').style.display = 'block';
            document.getElementById('topup-confirm-btn').style.display = 'block';
        }

        function selectTopupMethod(method) {
            if (method === 'ton') return; // TON disabled
            selectedTopupMethod = method;
            updateTopupUI();
        }

        async function confirmTopup() {
            const amount = document.getElementById('topup-amount-input').value;
            
            if (!amount || parseInt(amount) <= 0) {
                alert('Введите корректную сумму');
                return;
            }
            
            if (selectedTopupMethod === 'stars') {
                processTopupStars(parseInt(amount));
            }
        }

        async function processTopupStars(amount) {
            const confirmBtn = document.getElementById('topup-confirm-btn');
            const originalText = confirmBtn.textContent;
            
            try {
                const user_id = window.tgUserId || (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user && window.Telegram.WebApp.initDataUnsafe.user.id) || 'anonymous';
                
                // Show loading state
                confirmBtn.textContent = 'Загрузка...';
                confirmBtn.disabled = true;
                console.log('[Payment] Creating invoice for', amount, 'stars, user:', user_id);
                
                const createResponse = await fetch('/api/create-stars-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_id, stars_amount: parseInt(amount) })
                });
                
                if (!createResponse.ok) {
                    console.error('[Payment] Create invoice HTTP error:', createResponse.status);
                    throw new Error('Ошибка сервера: ' + createResponse.status);
                }
                
                const invoiceData = await createResponse.json();
                console.log('[Payment] Invoice response:', invoiceData);
                
                if (!invoiceData.success) {
                    console.error('[Payment] Invoice error:', invoiceData.error);
                    throw new Error(invoiceData.error || 'Не удалось создать счет');
                }
                
                if (!invoiceData.invoice_link) {
                    console.error('[Payment] No invoice link in response');
                    throw new Error('Ссылка на платеж не получена');
                }
                
                confirmBtn.textContent = originalText;
                confirmBtn.disabled = false;
                
                console.log('[Payment] Opening Telegram invoice:', invoiceData.invoice_link.substring(0, 50) + '...');
                
                if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp && typeof window.Telegram.WebApp.openInvoice === 'function') {
                    let callbackFired = false;
                    let initialBalance = null;
                    
                    // Get initial balance for verification
                    try {
                        const balanceResp = await fetch(`/api/user/get?user_id=${user_id}`);
                        const balanceData = await balanceResp.json();
                        if (balanceData.status === 'ok') {
                            initialBalance = parseFloat(balanceData.balance || 0);
                            console.log('[Payment] Initial balance:', initialBalance);
                        }
                    } catch (e) {
                        console.error('[Payment] Failed to get initial balance:', e);
                    }
                    
                    // Set timeout in case callback doesn't fire
                    const timeoutId = setTimeout(async () => {
                        if (!callbackFired) {
                            console.log('[Payment] Callback timeout - checking balance...');
                            clearTimeout(timeoutId);
                            
                            // Auto-check payment by polling balance
                            let paymentConfirmed = false;
                            for (let attempt = 0; attempt < 10; attempt++) {
                                await new Promise(resolve => setTimeout(resolve, 1000)); // wait 1 sec
                                
                                try {
                                    const checkResp = await fetch(`/api/user/get?user_id=${user_id}&t=${Date.now()}`);
                                    const checkData = await checkResp.json();
                                    if (checkData.status === 'ok') {
                                        const newBalance = parseFloat(checkData.balance || 0);
                                        const tonEquivalent = (amount * 0.01).toFixed(4);
                                        console.log('[Payment] Checked balance:', newBalance, '(was:', initialBalance, ')');
                                        
                                        if (newBalance > initialBalance) {
                                            console.log('[Payment] ✅ Balance increased - payment successful!');
                                            paymentConfirmed = true;
                                            break;
                                        }
                                    }
                                } catch (e) {
                                    console.error('[Payment] Error checking balance:', e);
                                }
                            }
                            
                            closeTopupModal();
                            
                            if (paymentConfirmed) {
                                alert(`✅ Спасибо за пополнение!\n${amount} Stars = ${(amount * 0.01).toFixed(4)} TON`);
                                setTimeout(() => location.reload(), 1000);
                            } else {
                                alert('⏳ Платеж обрабатывается...\nПожалуйста, закройте эту страницу и вернитесь через несколько минут для проверки баланса.');
                                setTimeout(() => location.reload(), 3000);
                            }
                        }
                    }, 30000); // 30 second timeout
                    
                    window.Telegram.WebApp.openInvoice(invoiceData.invoice_link, async (status) => {
                        callbackFired = true;
                        clearTimeout(timeoutId);
                        console.log('[Payment] Invoice callback with status:', status);
                        
                        if (status === 'paid') {
                            await confirmStarsPayment(invoiceData.invoice_id, user_id, amount);
                            closeTopupModal();
                            alert(`✅ Спасибо за пополнение!\n${amount} Stars = ${invoiceData.ton_equivalent.toFixed(4)} TON`);
                        } else if (status === 'failed') {
                            alert('❌ Платёж не прошёл. Попробуйте еще раз.');
                        } else if (status === 'cancelled') {
                            alert('❌ Платёж отменён');
                        } else {
                            console.log('[Payment] Unknown status:', status);
                            alert('Статус платежа: ' + status);
                        }
                    });
                } else {
                    console.log('[Payment] Telegram WebApp not available, processing directly');
                    await confirmStarsPayment(invoiceData.invoice_id, user_id, amount);
                    closeTopupModal();
                    alert(`✅ Платёж обработан!\n${amount} Stars = ${invoiceData.ton_equivalent.toFixed(4)} TON`);
                }
            } catch (error) {
                console.error('[Payment] Final error:', error);
                console.error('[Payment] Error type:', error.constructor.name);
                confirmBtn.textContent = originalText;
                confirmBtn.disabled = false;
                
                // Show more detailed error
                let errorMsg = error.message;
                if (error.message.includes('WebAppInvoiceUrlInvalid')) {
                    errorMsg = 'Неправильный формат ссылки платежа\n(свяжитесь с поддержкой)';
                } else if (error.message.includes('демо')) {
                    errorMsg = 'Сервер в демо режиме\n(платежи недоступны)';
                }
                
                alert('⚠️ Ошибка платежа:\n' + errorMsg);
            }
        }

        async function confirmStarsPayment(invoice_id, user_id, stars_amount) {
            try {
                const response = await fetch('/api/process-stars-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_id, invoice_id: invoice_id, stars_amount: parseInt(stars_amount) })
                });
                if (!response.ok) throw new Error('Payment confirmation failed');
                
                const data = await response.json();
                if (data.success) {
                    // Reload page to refresh balance
                    setTimeout(() => location.reload(), 1000);
                    console.log('[Stars Payment] Success:', data);
                } else {
                    console.error('[Stars Payment] Server error:', data);
                }
            } catch (error) {
                console.error('Error confirming payment:', error);
            }
        }

        // Close modal on outside click
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('topup-modal');
            if (e.target === modal) closeTopupModal();
        });

        // Validate stars input to only allow integers
        document.getElementById('topup-amount-input').addEventListener('input', function(e) {
            if (this.getAttribute('data-stars-only') === 'true') {
                let value = this.value.replace(/[^0-9]/g, '');
                if (value === '') value = '1';
                this.value = value;
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            initTelegram();
            const tgUser = tg?.initDataUnsafe?.user;
            
            if (tgUser?.id) {
                currentUserId = parseInt(tgUser.id);
                const userName = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
                document.getElementById('tg-username-large').textContent = userName;
                
                if (tgUser.photo_url) {
                    document.getElementById('tg-avatar-large').src = tgUser.photo_url;
                    document.getElementById('tg-avatar-large').style.display = 'block';
                    document.getElementById('default-avatar').style.display = 'none';
                }
            } else {
                currentUserId = 123;
                document.getElementById('tg-username-large').textContent = 'Test User';
            }
            
            // Initialize settings UI and apply saved settings
            try { initSettingsUI(); applySettings(); } catch (e) { console.error('[SETTINGS] init error', e); }

            await loadProfileData();
            await loadReferralCode();
        });

        async function loadProfileData() {
            if (!currentUserId) return;
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`/api/user/get?user_id=${currentUserId}&t=${timestamp}`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    currentInventory = data.inventory || [];
                    loadInventory(currentInventory);
                    await loadReferralData();
                }
            } catch (error) {
                console.error('[ERROR]:', error);
            }
        }

        async function loadReferralData() {
            if (!currentUserId) return;
            try {
                const response = await fetch(`/api/user/referral-info/${currentUserId}`);
                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('referrals-count').textContent = data.referrals_count || 0;
                    document.getElementById('referral-earnings').textContent = (data.referral_earnings || 0).toFixed(2) + ' TON';
                }
            } catch (e) {
                console.error('[ERROR]:', e);
            }
        }

        async function loadReferralCode() {
            if (!currentUserId) return;
            try {
                const response = await fetch(`/api/referral/code/${currentUserId}`);
                const data = await response.json();
                if (data.status === 'ok') {
                    const code = data.referral_code || data.code || '';
                    const input = document.getElementById('referral-code');
                    if (input) input.value = code;
                    if (data.referrals_count !== undefined) document.getElementById('referrals-count').textContent = data.referrals_count;
                    if (data.referral_earnings !== undefined) document.getElementById('referral-earnings').textContent = (data.referral_earnings || 0).toFixed(2) + ' TON';
                }
            } catch (e) { console.error('[ERROR] loadReferralCode:', e); }
        }

        async function saveReferralCode() {
            const input = document.getElementById('referral-code');
            if (!input) return;
            const code = input.value.trim().toUpperCase();
            if (!code || !currentUserId) {
                if (typeof showToast === 'function') showToast('Invalid code', 'error');
                return;
            }

            try {
                const resp = await fetch('/api/referral/code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: String(currentUserId), code: code })
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    if (typeof showToast === 'function') showToast((typeof t === 'function' ? t('promo_saved') : 'Saved'), 'success');
                    loadReferralCode();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Save failed', 'error');
                }
            } catch (e) {
                console.error('[ERROR] saveReferralCode:', e);
                if (typeof showToast === 'function') showToast('Save failed', 'error');
            }
        }

        

        // Settings: persist in localStorage under 'rps_settings'
        function loadSettings() {
            try {
                const raw = localStorage.getItem('rps_settings');
                if (!raw) return { theme: 'light', lang: 'ru', vibration: false };
                return JSON.parse(raw);
            } catch (e) {
                console.error('[SETTINGS] load error', e);
                return { theme: 'light', lang: 'ru', vibration: false };
            }
        }

        function saveSettings(s) {
            try {
                localStorage.setItem('rps_settings', JSON.stringify(s));
            } catch (e) { console.error('[SETTINGS] save error', e); }
        }

            function applySettings() {
                const s = loadSettings();
                // Theme
                const themeChk = document.getElementById('theme-toggle');
                if (s.theme === 'dark') {
                    document.body.classList.add('dark-theme');
                    try { document.documentElement.setAttribute('data-theme', 'dark'); } catch(e) {}
                    if (themeChk) themeChk.checked = true;
                } else {
                    document.body.classList.remove('dark-theme');
                    try { document.documentElement.removeAttribute('data-theme'); } catch(e) {}
                    if (themeChk) themeChk.checked = false;
                }
            // Language
            const langChk = document.getElementById('language-toggle');
            if (langChk) langChk.checked = (s.lang || 'ru') === 'ru';
            // Apply language translations if available
            if (typeof applyLanguage === 'function') applyLanguage(s.lang || 'ru');
            // Vibration
            const vib = document.getElementById('vibration-toggle');
            if (vib) vib.checked = !!s.vibration;
        }

        // Attach settings handlers after DOM ready
        function initSettingsUI() {
            const themeChk = document.getElementById('theme-toggle');
            const langChk = document.getElementById('language-toggle');
            const vibChk = document.getElementById('vibration-toggle');

            if (themeChk) themeChk.addEventListener('change', () => {
                const s = loadSettings();
                s.theme = themeChk.checked ? 'dark' : 'light';
                saveSettings(s);
                applySettings();
                if (typeof showToast === 'function') showToast('Theme: ' + s.theme, 'info');
            });

            if (langChk) langChk.addEventListener('change', () => {
                const s = loadSettings();
                s.lang = langChk.checked ? 'ru' : 'en';
                saveSettings(s);
                // apply language globally
                if (typeof applyLanguage === 'function') applyLanguage(s.lang || 'ru');
                if (typeof showToast === 'function') showToast('Language: ' + s.lang, 'info');
            });

            if (vibChk) vibChk.addEventListener('change', () => {
                const s = loadSettings();
                s.vibration = !!vibChk.checked;
                saveSettings(s);
                if (s.vibration && navigator.vibrate) navigator.vibrate(100);
                if (typeof showToast === 'function') showToast('Vibration: ' + (s.vibration ? 'On' : 'Off'), 'info');
            });
        }

        function copyReferralCode() {
            const input = document.getElementById('referral-code');
            const val = input ? input.value || '' : '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).then(() => {
                    if (typeof showToast === 'function') showToast((typeof t === 'function' ? t('copy_success') : 'Code copied!'), 'success');
                }).catch(() => { if (typeof showToast === 'function') showToast((typeof t === 'function' ? t('copy_failed') : 'Copy failed'), 'error'); });
            } else {
                try {
                    input.select();
                    document.execCommand('copy');
                    if (typeof showToast === 'function') showToast('Code copied!', 'success');
                } catch (e) {
                    if (typeof showToast === 'function') showToast('Copy failed', 'error');
                }
            }
        }

        function openGiftModal(giftId, giftName, giftPrice, giftImage) {
            selectedGiftForSale = { id: giftId, name: giftName, price: giftPrice, image: giftImage };
            document.getElementById('gift-modal-name').textContent = giftName;
            document.getElementById('gift-modal-image').src = giftImage;
            document.getElementById('gift-modal-price').textContent = giftPrice.toFixed(2) + ' TON';
            document.getElementById('gift-modal-sell-price').textContent = giftPrice.toFixed(2);
            document.getElementById('gift-modal').style.display = 'flex';
        }

        function closeGiftModal() {
            document.getElementById('gift-modal').style.display = 'none';
            selectedGiftForSale = null;
        }

        function sellSingleGift() {
            if (!selectedGiftForSale || !currentUserId) {
                if (typeof showToast === 'function') showToast('Invalid gift or user', 'error'); else alert('Invalid gift or user');
                return;
            }

            fetch(`/api/user/sell-all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, gift_ids: [selectedGiftForSale.id] })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    // compute icon src for the sold gift
                    let iconSrc = '/static/img/default.png';
                    try {
                        if (selectedGiftForSale && selectedGiftForSale.image) {
                            iconSrc = selectedGiftForSale.image.startsWith('/') ? selectedGiftForSale.image : '/static/img/gifts/' + selectedGiftForSale.image;
                        }
                    } catch (e) { iconSrc = '/static/img/default.png'; }

                    if (typeof showToast === 'function') showToast('Sold for ' + selectedGiftForSale.price.toFixed(2) + ' TON. New balance: ' + (data.new_balance || 0).toFixed(2) + ' TON', 'success', iconSrc); else alert('Sold for ' + selectedGiftForSale.price.toFixed(2) + ' TON');
                    closeGiftModal();
                    loadProfileData();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Sale failed', 'error'); else alert('ERROR: ' + (data.error || 'Sale failed'));
                }
            })
            .catch(err => { if (typeof showToast === 'function') showToast(err.message, 'error'); else alert('ERROR: ' + err.message); });
        }

        function loadInventory(gifts) {
            const inventorySection = document.querySelector('.inventory-section');
            
            // Skip if inventory section doesn't exist on this page
            if (!inventorySection) return;
            
            if (!gifts || gifts.length === 0) {
                inventorySection.innerHTML = `
                    <div class="empty-inventory">
                        <img src="{{ url_for('static', filename='gifs/gift.gif') }}" class="empty-gif">
                        <p style="color: var(--text-light); margin: 0;" data-i18n="empty_inventory">Empty</p>
                    </div>
                `;
                if (typeof applyLanguage === 'function') applyLanguage(document.documentElement.lang || 'ru');
                return;
            }

            fetch('/api/gifts/list?t=' + new Date().getTime())
                .then(r => r.json())
                .then(response => {
                    if (response.status !== 'ok' || !response.gifts) throw new Error('Invalid API response');
                    
                    let html = '<div class="inventory-grid">';
                    gifts.forEach(giftItem => {
                        const giftId = typeof giftItem === 'string' ? giftItem : giftItem.id;
                        const gift = response.gifts.find(g => g.id === giftId);
                        if (gift) {
                            html += `
                                <div class="gift-card" onclick="openGiftModal('${gift.id}', '${gift.name}', ${gift.price}, '${gift.image}')">
                                    <p class="gift-card-name">${gift.name}</p>
                                    <img src="${gift.image}" alt="${gift.name}" style="width: 60px; height: 60px; object-fit: contain; margin: 0 auto; display: block;" onerror="this.src='/static/img/default.png'">
                                    <p class="gift-card-price">${gift.price.toFixed(2)} TON</p>
                                </div>
                            `;
                        }
                    });
                    html += '</div>';
                    inventorySection.innerHTML = html;
                    if (typeof applyLanguage === 'function') applyLanguage(document.documentElement.lang || 'ru');
                })
                .catch(err => console.error('[ERROR]:', err));
        }

        async function sellAllGifts() {
            if (!currentUserId || !currentInventory || currentInventory.length === 0) {
                if (typeof showToast === 'function') showToast('Inventory is empty', 'warning'); else alert('Inventory is empty');
                return;
            }

            if (!(await window.showConfirm('Sell all ' + currentInventory.length + ' gifts?'))) return;

            const giftIds = currentInventory.map(item => typeof item === 'string' ? item : item.id);
            
            fetch(`/api/user/sell-all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, gift_ids: giftIds })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    // pick an icon from inventory (first item) when available
                    let iconSrc = '/static/img/default.png';
                    try {
                        if (currentInventory && currentInventory.length > 0) {
                            const first = currentInventory[0];
                            const img = (typeof first === 'string') ? null : first.image;
                            if (img) iconSrc = img.startsWith('/') ? img : '/static/img/gifts/' + img;
                        }
                    } catch (e) { iconSrc = '/static/img/default.png'; }

                    if (typeof showToast === 'function') showToast('Sold! Received ' + (data.total_amount || 0).toFixed(2) + ' TON. New balance: ' + (data.new_balance || 0).toFixed(2) + ' TON', 'success', iconSrc); else alert('Sold! Received ' + (data.total_amount || 0).toFixed(2) + ' TON');
                    currentInventory = [];
                    loadProfileData();
                } else {
                    if (typeof showToast === 'function') showToast(data.error || 'Sale error', 'error'); else alert('ERROR: ' + (data.error || 'Sale error'));
                }
            })
            .catch(err => { if (typeof showToast === 'function') showToast(err.message, 'error'); else alert('ERROR: ' + err.message); });
        }

        function openPromo() {
            if (!currentUserId) {
                if (typeof showToast === 'function') showToast('User not set', 'error'); else alert('User not set');
                return;
            }
            document.getElementById('promo-modal').style.display = 'flex';
        }

        function closePromo() {
            document.getElementById('promo-modal').style.display = 'none';
            document.getElementById('promo-status-modal').innerHTML = '';
            document.getElementById('promo-status-modal').style.display = 'none';
        }

        async function submitPromo() {
            const code = document.getElementById('promo-field').value.trim().toUpperCase();

            if (!code || !currentUserId) {
                if (typeof showToast === 'function') showToast('Invalid code or user', 'error'); else alert('Invalid code or user');
                return;
            }

            const statusDiv = document.getElementById('promo-status-modal');
            statusDiv.innerHTML = '<p style="color: var(--primary);" data-i18n="checking">Checking...</p>';
            statusDiv.style.display = 'block';

            try {
                const response = await fetch('/api/referral/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: String(currentUserId), code: code })
                });
                const data = await response.json();

                if (data.status === 'ok') {
                    statusDiv.innerHTML = `<p style="color: var(--primary);">SUCCESS: ${data.message || (typeof t === 'function' ? t('promo_applied_success') : 'Code applied')}</p>`;
                    if (typeof showToast === 'function') showToast(data.message || (typeof t === 'function' ? t('promo_applied_success') : 'Code applied'), 'success');
                    document.getElementById('promo-field').value = '';
                    setTimeout(() => {
                        loadProfileData();
                        loadReferralCode();
                        closePromo();
                    }, 1000);
                } else {
                    statusDiv.innerHTML = `<p style="color: var(--text-light);">ERROR: ${data.error}</p>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<p style="color: var(--text-light);">ERROR: ${error.message}</p>`;
            }
        }

        document.getElementById('promo-field').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitPromo();
        });

        document.getElementById('promo-modal').addEventListener('click', (e) => {
            if (e.target.id === 'promo-modal') closePromo();
        });

        document.getElementById('gift-modal').addEventListener('click', (e) => {
            if (e.target.id === 'gift-modal') closeGiftModal();
        });

        document.getElementById('topup-modal').addEventListener('click', (e) => {
            if (e.target.id === 'topup-modal') closeTopupModal();
        });
    </script>
    
    <!-- Load main app first -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    
    <!-- Load TonConnect Integration (after app.js loads) -->
    <script src="{{ url_for('static', filename='tonconnect.js') }}"></script>
