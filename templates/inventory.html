<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory</title>
    <script>
        // Apply theme early to avoid flash-of-incorrect-theme
        try {
            const raw = localStorage.getItem('rps_settings');
            if (raw) {
                const s = JSON.parse(raw);
                if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                else document.documentElement.removeAttribute('data-theme');
            }
        } catch (e) { /* ignore */ }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='vendor/tonconnect-ui.min.js') }}"></script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
        }
        
        .inventory-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 16px 80px 16px;
            background: var(--bg);
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);  /* 2 columns on mobile */
            gap: 12px;
            align-items: start;
        }

        @media (min-width: 600px) {
            .inventory-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1024px) {
            .inventory-grid { grid-template-columns: repeat(5, 1fr); }
        }
        
        .gift-card {
            text-align: center;
            cursor: pointer;
            padding: 14px;
            border-radius: 12px;
            background: var(--card);
            transition: all 0.2s;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            color: var(--text);
        }
        
        .gift-card:active {
            background: var(--bg);
            transform: scale(0.95);
        }
        
        .gift-card img {
            width: 100%;
            max-width: 120px;
            height: auto;
            object-fit: contain;
            margin: 0 auto 10px;
            display: block;
        }
        
        .gift-card-name {
            font-size: 13px;
            color: var(--text);
            margin: 0 0 6px 0;
            font-weight: 600;
            line-height: 1.2;
        }
        
        .gift-card-price {
            font-size: 13px;
            color: var(--primary);
            font-weight: bold;
            margin: 0;
        }
        
        .empty-inventory {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        
        .empty-gif {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-inventory p {
            color: var(--text-light);
            margin: 0;
            font-size: 13px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: var(--card);
            color: var(--text);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 350px;
        }
    </style>
</head>
<body>
    <div id="notification-drawer" style="position:fixed;top:12px;left:8px;right:8px;z-index:10000;display:flex;flex-direction:column;pointer-events:none;align-items:center;"></div>
    <div class="app-container">
        <div class="inventory-scroll-wrapper">
            <div class="inventory-section">
                <div class="empty-inventory">
                    <img src="{{ url_for('static', filename='gifs/gift.gif') }}" class="empty-gif">
                    <p data-i18n="empty_inventory">No items</p>
                </div>
            </div>
        </div>
    </div>

    <div id="gift-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="gift-modal-name" style="margin: 0;">Gift</h3>
                <button class="modal-close" onclick="closeGiftModal()">×</button>
            </div>
            <img id="gift-modal-image" src="" style="width: 100px; height: 100px; margin: 16px auto; object-fit: contain; display: block;">
            <p id="gift-modal-price" class="gift-modal-price">0.0 TON</p>
            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button onclick="sellSingleGift()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;">
                    <span data-i18n="sell">Sell</span> <span id="gift-modal-sell-price">0.0</span> TON
                </button>
                <button onclick="withdrawGift()" style="width: 100%; padding: 12px; background: var(--card); color: var(--primary); border: 2px solid var(--primary); border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;">
                    <span data-i18n="withdraw">Withdraw</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Inventory group modal -->
    <div id="inventory-group-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <h3 id="inventory-group-title" style="margin:0;font-size:16px;">Items</h3>
                <button class="modal-close" onclick="closeInventoryGroupModal()">×</button>
            </div>
            <div id="inventory-group-list" style="margin-top:12px;max-height:60vh;overflow:auto;"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </a>
        <a href="/market" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M3 9H21L19 20H5L3 9Z"></path><path d="M8 9V6C8 4.34315 9.34315 3 11 3H13C14.6569 3 16 4.34315 16 6V9"></path></svg>
        </a>
        <a href="/crafts" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </a>
        <a href="/profile" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </a>
        <a href="/inventory" class="nav-item active">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><circle cx="8" cy="14" r="1.5"></circle><circle cx="16" cy="14" r="1.5"></circle></svg>
        </a>
    </nav>

    <script>
        // Fallback showToast function (will be overridden by app.js)
        function showToast(message, type = 'info', duration = 3000) {
            console.log(`[TOAST ${type.toUpperCase()}] ${message}`);
            alert(message);
        }

        let currentInventory = [];
        let selectedGiftForSale = null;
        let pendingWithdrawalGifts = [];  // Track gifts with pending withdrawals (legacy list)
        let pendingWithdrawalRequests = []; // detailed pending requests [{gift_id, inventory_index, request_id}]
        let pendingByIndex = new Set();
        let pendingByGiftId = new Set();

        function initTelegram() {
            if (typeof window.Telegram === 'undefined' || !window.Telegram.WebApp) {
                console.warn('[WARN] Telegram not available');
                return null;
            }
            tg = window.Telegram.WebApp;
            try {
                tg.expand();
                tg.ready();
                return tg;
            } catch (e) {
                console.error('[ERROR] Telegram init:', e);
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[INIT] inventory.html loading...');
            initTelegram();
            const tgUser = tg?.initDataUnsafe?.user;
            
            if (tgUser?.id) {
                currentUserId = parseInt(tgUser.id);
            } else {
                currentUserId = 123;
            }
            
            console.log('[INIT] User ID:', currentUserId);
            
            // Load pending withdrawals FIRST, then inventory
            await loadPendingWithdrawals();
            await loadProfileData();
            
            // Periodically refresh pending withdrawals and update UI every 3 seconds
            setInterval(async () => {
                await loadPendingWithdrawals();
                updateInventoryUI();
            }, 3000);
        });

        async function loadProfileData() {
            if (!currentUserId) {
                console.error('[ERROR] currentUserId not set');
                return;
            }
            try {
                console.log('[DEBUG] Loading user data for:', currentUserId);
                const timestamp = new Date().getTime();
                const response = await fetch(`/api/user/get?user_id=${currentUserId}&t=${timestamp}`);
                console.log('[DEBUG] Response status:', response.status);
                
                const data = await response.json();
                console.log('[DEBUG] User data received:', data);
                
                if (data.status === 'ok') {
                    currentInventory = data.inventory || [];
                    console.log('[DEBUG] Inventory loaded:', currentInventory);
                    loadInventory(currentInventory);
                } else {
                    console.error('[ERROR] API error:', data.error);
                    showToast('Error loading inventory: ' + (data.error || 'Unknown'), 'error');
                }
            } catch (error) {
                console.error('[ERROR] loadProfileData exception:', error);
                showToast('Failed to load inventory', 'error');
            }
        }

        function openGiftModal(giftId, giftName, giftPrice, giftImage, inventoryIndex = null) {
            selectedGiftForSale = { id: giftId, name: giftName, price: giftPrice, image: giftImage };
            if (inventoryIndex !== null && inventoryIndex !== undefined) selectedGiftForSale.inventoryIndex = parseInt(inventoryIndex, 10);
            document.getElementById('gift-modal-name').textContent = giftName;
            document.getElementById('gift-modal-image').src = giftImage;
            document.getElementById('gift-modal-price').textContent = giftPrice.toFixed(2) + ' TON';
            document.getElementById('gift-modal-sell-price').textContent = giftPrice.toFixed(2);
            document.getElementById('gift-modal').style.display = 'flex';
        }

        function closeGiftModal() {
            document.getElementById('gift-modal').style.display = 'none';
            selectedGiftForSale = null;
        }

        function sellSingleGift() {
            console.log('[DEBUG] sellSingleGift called');
            if (!selectedGiftForSale || !currentUserId) {
                console.error('[ERROR] Invalid gift or user:', selectedGiftForSale, currentUserId);
                showToast('Invalid gift or user', 'error');
                return;
            }

            // Check if gift has pending withdrawal
            // Instance-level pending check
            if (selectedGiftForSale.inventoryIndex !== undefined && selectedGiftForSale.inventoryIndex !== null) {
                if (pendingByIndex.has(String(selectedGiftForSale.inventoryIndex))) {
                    console.log('[BLOCKED] Instance has pending withdrawal');
                    showToast('Cannot sell: this instance has pending withdrawal request', 'error');
                    return;
                }
            } else if (pendingByGiftId.has(String(selectedGiftForSale.id))) {
                console.log('[BLOCKED] Gift type has pending withdrawal');
                showToast('Cannot sell: gift has pending withdrawal request', 'error');
                return;
            }

            // If inventoryIndex present, call sell-instance endpoint to sell specific instance
            if (selectedGiftForSale.inventoryIndex !== undefined && selectedGiftForSale.inventoryIndex !== null) {
                console.log('[FETCH] Selling specific instance:', selectedGiftForSale.id, 'index', selectedGiftForSale.inventoryIndex);
                fetch(`/api/user/sell-instance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, inventory_index: selectedGiftForSale.inventoryIndex })
                })
            .then(r => {
                console.log('[RESPONSE] Status:', r.status);
                return r.json();
            })
            .then(data => {
                console.log('[DATA]', data);
                if (data.status === 'ok') {
                    // compute icon for sold gift
                    let iconSrc = '/static/img/default.png';
                    try { if (selectedGiftForSale && selectedGiftForSale.image) iconSrc = selectedGiftForSale.image.startsWith('/') ? selectedGiftForSale.image : '/static/img/gifts/' + selectedGiftForSale.image; } catch (e) { iconSrc = '/static/img/default.png'; }

                    showToast('Sold for ' + selectedGiftForSale.price.toFixed(2) + ' TON', 'success', iconSrc);
                    closeGiftModal();
                    loadProfileData();
                    loadPendingWithdrawals();  // Refresh pending list
                } else {
                    showToast(data.error || 'Sale failed', 'error');
                }
            })
            .catch(err => {
                console.error('[CATCH ERROR]', err);
                showToast(err.message, 'error');
            });

            } else {
                // Fallback: sell by gift id via sell-all endpoint
                console.log('[FETCH] Selling gift by id:', selectedGiftForSale.id);
                fetch(`/api/user/sell-all`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, gift_ids: [selectedGiftForSale.id] })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok') {
                        let iconSrc = '/static/img/default.png';
                        try { if (selectedGiftForSale && selectedGiftForSale.image) iconSrc = selectedGiftForSale.image.startsWith('/') ? selectedGiftForSale.image : '/static/img/gifts/' + selectedGiftForSale.image; } catch (e) { iconSrc = '/static/img/default.png'; }
                        showToast('Sold for ' + selectedGiftForSale.price.toFixed(2) + ' TON', 'success', iconSrc);
                        closeGiftModal();
                        loadProfileData();
                        loadPendingWithdrawals();
                    } else {
                        showToast(data.error || 'Sale failed', 'error');
                    }
                })
                .catch(err => {
                    console.error('[CATCH ERROR]', err);
                    showToast(err.message, 'error');
                });
            }
        }

        function withdrawGift() {
            console.log('[DEBUG] withdrawGift called');
            if (!selectedGiftForSale || !currentUserId) {
                console.error('[ERROR] Invalid gift or user:', selectedGiftForSale, currentUserId);
                showToast('Invalid gift or user', 'error');
                return;
            }
            // Instance-level pending check
            if (selectedGiftForSale.inventoryIndex !== undefined && selectedGiftForSale.inventoryIndex !== null) {
                if (pendingByIndex.has(String(selectedGiftForSale.inventoryIndex))) {
                    console.log('[BLOCKED] Instance already has pending withdrawal');
                    showToast('This instance already has a pending withdrawal request', 'error');
                    return;
                }
            } else if (pendingByGiftId.has(String(selectedGiftForSale.id))) {
                console.log('[BLOCKED] Gift type already has pending withdrawal');
                showToast('Gift already has pending withdrawal request', 'error');
                return;
            }

            console.log('[FETCH] Creating withdrawal request for gift:', selectedGiftForSale.id);
            const body = { user_id: currentUserId, gift_id: selectedGiftForSale.id, gift_name: selectedGiftForSale.name };
            if (selectedGiftForSale.inventoryIndex !== undefined && selectedGiftForSale.inventoryIndex !== null) body.inventory_index = selectedGiftForSale.inventoryIndex;

            fetch(`/api/user/request-withdrawal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(r => {
                console.log('[RESPONSE] Status:', r.status);
                return r.json();
            })
            .then(data => {
                console.log('[DATA]', data);
                if (data.status === 'ok') {
                    // include icon for withdrawal request
                    let iconSrc = '/static/img/default.png';
                    try { if (selectedGiftForSale && selectedGiftForSale.image) iconSrc = selectedGiftForSale.image.startsWith('/') ? selectedGiftForSale.image : '/static/img/gifts/' + selectedGiftForSale.image; } catch (e) { iconSrc = '/static/img/default.png'; }

                    showToast('Withdrawal request submitted', 'success', iconSrc);
                    closeGiftModal();
                    loadProfileData();
                    loadPendingWithdrawals();  // Refresh pending list
                } else {
                    showToast(data.error || 'Request failed', 'error');
                }
            })
            .catch(err => {
                console.error('[CATCH ERROR]', err);
                showToast(err.message, 'error');
            });
        }

        function loadInventory(gifts) {
            const inventorySection = document.querySelector('.inventory-section');
            console.log('[INVENTORY] loadInventory called with:', gifts);
            
                    if (!gifts || gifts.length === 0) {
                console.log('[INVENTORY] Empty inventory');
                    inventorySection.innerHTML = `
                    <div class="empty-inventory">
                        <img src="{{ url_for('static', filename='gifs/gift.gif') }}" class="empty-gif">
                        <p data-i18n="empty_inventory">No items</p>
                    </div>
                `;
                if (typeof applyLanguage === 'function') applyLanguage(document.documentElement.lang || 'ru');
                return;
            }

            console.log('[INVENTORY] Loading gifts from API...');
            fetch('/api/gifts/list?t=' + new Date().getTime())
                .then(r => {
                    console.log('[INVENTORY] API response status:', r.status);
                    return r.json();
                })
                .then(response => {
                    console.log('[INVENTORY] API response:', response);
                    if (response.status !== 'ok' || !response.gifts) throw new Error('Invalid API response');
                    
                    let html = '<div class="inventory-grid">';
                    // Build search input + grouped grid (aggregate duplicates)
                    let htmlParts = [];
                        htmlParts.push('<div style="display:flex; gap:8px; margin-bottom:12px;"><input id="search-inventory" type="text" data-i18n-placeholder="search_inventory_placeholder" placeholder="Search inventory..." style="flex:1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--card); color: var(--text);" oninput="filterInventory()"></div>');
                    htmlParts.push('<div class="inventory-grid">');

                    // Build instances list and groups
                    const instances = [];
                    gifts.forEach((giftItem, index) => {
                        const giftId = typeof giftItem === 'string' ? giftItem : giftItem.id;
                        const gift = response.gifts.find(g => g.id === giftId);
                        if (!gift) return;
                        instances.push({ giftId, gift, index });
                    });

                    const groups = {};
                    instances.forEach(inst => {
                        if (!groups[inst.giftId]) groups[inst.giftId] = [];
                        groups[inst.giftId].push(inst);
                    });

                    // Expose groups for modal
                    window.inventoryGroups = groups;

                    Object.keys(groups).forEach(gid => {
                        const group = groups[gid];
                        const gift = group[0].gift;
                        const count = group.length;
                        // Compute pending count for this group (instance-level)
                        let pendingCount = 0;
                        const groupInstances = groups[gid];
                        groupInstances.forEach(inst => { if (pendingByIndex.has(String(inst.index))) pendingCount++; });

                        const badge = count > 1 ? `<div style="position:absolute; top:8px; right:8px; background:var(--primary); color:white; padding:4px 8px; border-radius:12px; font-size:12px; font-weight:700;">x${count}</div>` : '';
                        const pendingLabel = pendingCount > 0 ? `<div style="position:absolute; left:8px; top:8px; padding:4px 8px; border-radius:12px; font-size:12px; font-weight:700;"><span class=\"pending-count\">${pendingCount}</span>&nbsp;<span data-i18n=\"pending_withdrawal\">pending</span></div>` : '';

                        if (count === 1) {
                            // Render single-instance as non-aggregated item so quick actions are available
                            const inst = group[0];
                            htmlParts.push(`
                                <div class="gift-card gift-item" data-gift-id="${gid}" data-gift-index="${inst.index}" style="position: relative;">
                                    <p class="gift-card-name">${gift.name}</p>
                                    <img src="${gift.image}" alt="${gift.name}" onerror="this.src='/static/img/default.png'">
                                    <p class="gift-card-price">${gift.price.toFixed(2)} TON</p>
                                    ${pendingLabel}
                                </div>
                            `);
                        } else {
                            htmlParts.push(`
                                <div class="gift-card gift-group" data-gift-id="${gid}" style="position: relative;">
                                    <p class="gift-card-name">${gift.name}</p>
                                    <img src="${gift.image}" alt="${gift.name}" onerror="this.src='/static/img/default.png'">
                                    <p class="gift-card-price">${gift.price.toFixed(2)} TON</p>
                                    ${pendingLabel}
                                    ${badge}
                                </div>
                            `);
                        }
                    });

                    htmlParts.push('</div>');
                    inventorySection.innerHTML = htmlParts.join('\n');

                    // Attach click handler to grouped cards
                    document.querySelectorAll('.gift-group').forEach(el => {
                        const gid = el.getAttribute('data-gift-id');
                        if (!gid) return;
                        el.addEventListener('click', () => showInventoryGroup(gid));
                    });

                    // Attach click handler to single-instance items to open quick actions modal
                    document.querySelectorAll('.gift-item').forEach(el => {
                        const idx = el.getAttribute('data-gift-index');
                        const gid = el.getAttribute('data-gift-id');
                        if (!gid || idx === null) return;
                        el.addEventListener('click', () => {
                            const groups = window.inventoryGroups || {};
                            const group = groups[gid] || [];
                            const gift = group[0] ? group[0].gift : null;
                            if (!gift) return;
                            let img = gift.image || '/static/img/default.png';
                            if (!img.startsWith('/')) img = '/static/img/gifts/' + img;
                            openGiftModal(gift.id, gift.name, gift.price, img, parseInt(idx, 10));
                        });
                    });
                    console.log('[INVENTORY] Loaded', response.gifts.length, 'gifts');
                    // Re-apply language translations for dynamically created elements
                    if (typeof applyLanguage === 'function') applyLanguage(document.documentElement.lang || 'ru');
                })
                .catch(err => {
                    console.error('[INVENTORY] Error loading gifts:', err);
                    inventorySection.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light);">Error loading gifts</div>';
                });
        }

        async function loadPendingWithdrawals() {
            if (!currentUserId) return;
            
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`/api/user/pending-withdrawals?user_id=${currentUserId}&t=${timestamp}`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    // Prefer detailed pending requests (includes inventory_index). Backcompat with pending_gift_ids.
                    pendingWithdrawalRequests = data.pending_requests || [];
                    pendingWithdrawalGifts = data.pending_gift_ids || pendingWithdrawalRequests.map(r => r.gift_id);

                    // Build lookup sets
                    pendingByIndex = new Set();
                    pendingByGiftId = new Set();
                    pendingWithdrawalRequests.forEach(r => {
                        if (r.inventory_index !== null && r.inventory_index !== undefined) pendingByIndex.add(String(r.inventory_index));
                        if (r.gift_id) pendingByGiftId.add(String(r.gift_id));
                    });

                    // Fallback: if only gift ids provided, populate pendingByGiftId
                    if (pendingByGiftId.size === 0 && Array.isArray(data.pending_gift_ids)) {
                        data.pending_gift_ids.forEach(id => pendingByGiftId.add(String(id)));
                    }

                    console.log('[OK] Loaded pending withdrawals:', { pendingWithdrawalRequests, pendingWithdrawalGifts });
                }
            } catch (error) {
                console.error('[ERROR] Loading pending withdrawals:', error);
            }
        }

        function showInventoryGroup(giftId) {
            const groups = window.inventoryGroups || {};
            const group = groups[giftId];
            if (!group || group.length === 0) return;

            const gift = group[0].gift;
            document.getElementById('inventory-group-title').textContent = `${gift.name} (${group.length})`;
            const list = document.getElementById('inventory-group-list');
            list.innerHTML = '';

            group.forEach(inst => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid var(--border);cursor:pointer;';
                let img = gift.image;
                if (!img.startsWith('/')) img = '/static/img/gifts/' + img;
                row.innerHTML = `<img src="${img}" style="width:42px;height:42px;object-fit:contain;" onerror="this.src='/static/img/default.png'">` +
                    `<div style="flex:1;"><div style="font-weight:600;color:var(--text)">${gift.name}</div><div style="font-size:12px;color:var(--text-light)">${gift.price.toFixed(2)} TON</div></div>` +
                    `<div style="font-size:12px;color:var(--text-light)">#${inst.index + 1}</div>`;

                    row.onclick = () => { closeInventoryGroupModal(); openGiftModal(gift.id, gift.name, gift.price, img, inst.index); };
                list.appendChild(row);
            });

            document.getElementById('inventory-group-modal').classList.add('active');
        }

        function closeInventoryGroupModal() {
            const modal = document.getElementById('inventory-group-modal');
            if (modal) modal.classList.remove('active');
        }

        function filterInventory() {
            const q = (document.getElementById('search-inventory').value || '').toLowerCase().trim();
            document.querySelectorAll('.gift-group, .gift-item').forEach(card => {
                const name = (card.querySelector('.gift-card-name') || { textContent: '' }).textContent.toLowerCase();
                if (name.includes(q)) card.style.display = '';
                else card.style.display = 'none';
            });
        }

        function updateInventoryUI() {
            // Update grouped gift cards (aggregated view)
            const groupCards = document.querySelectorAll('.gift-group');
            groupCards.forEach(card => {
                const gid = card.getAttribute('data-gift-id');
                if (!gid) return;

                const groups = window.inventoryGroups || {};
                const groupInstances = groups[gid] || [];

                // Compute how many instances are available (not pending)
                let availableCount = 0;
                groupInstances.forEach(inst => { if (!pendingByIndex.has(String(inst.index))) availableCount++; });

                    if (groupInstances.length > 0) {
                    if (availableCount === 0) {
                        card.style.opacity = '0.5';
                        card.style.cursor = 'not-allowed';
                        if (!card.querySelector('[data-pending]')) {
                            const label = document.createElement('div');
                            label.setAttribute('data-pending', 'true');
                            label.style.cssText = 'font-size: 11px; color: var(--text-light); margin-top: 4px;';
                            label.innerHTML = `<span class="pending-count">${pendingCount > 0 ? pendingCount + ' ' : ''}</span><span data-i18n="pending_withdrawal">Pending Withdrawal</span>`;
                            card.appendChild(label);
                        }
                    } else {
                        card.style.opacity = '1';
                        card.style.cursor = 'pointer';
                        const label = card.querySelector('[data-pending]');
                        if (label) label.remove();
                    }
                } else {
                    // Fallback: if we don't have instance data, fall back to gift-level pending flag
                    const isPending = pendingByGiftId.has(String(gid));
                    if (isPending) {
                        card.style.opacity = '0.5';
                        card.style.cursor = 'not-allowed';
                        if (!card.querySelector('[data-pending]')) {
                            const label = document.createElement('div');
                            label.setAttribute('data-pending', 'true');
                            label.style.cssText = 'font-size: 11px; color: var(--text-light); margin-top: 4px;';
                            label.innerHTML = `<span data-i18n="pending_withdrawal">Pending Withdrawal</span>`;
                            card.appendChild(label);
                        }
                    } else {
                        card.style.opacity = '1';
                        card.style.cursor = 'pointer';
                        const label = card.querySelector('[data-pending]');
                        if (label) label.remove();
                    }
                }
            });

            // Backwards compatibility: update any non-aggregated items
            const giftCards = document.querySelectorAll('.gift-item');
            giftCards.forEach(card => {
                const giftIndexAttr = card.getAttribute('data-gift-index');
                const isDisabled = card.getAttribute('data-disabled') === 'true';

                if (!giftIndexAttr) return;
                const giftIndex = parseInt(giftIndexAttr, 10);
                if (isNaN(giftIndex) || giftIndex < 0 || giftIndex >= currentInventory.length) return;

                const giftId = typeof currentInventory[giftIndex] === 'string'
                    ? currentInventory[giftIndex]
                    : currentInventory[giftIndex].id;

                const isPending = (pendingByIndex.has(String(giftIndex)) || (pendingByIndex.size === 0 && pendingByGiftId.has(String(giftId))));

                    if (isPending && !isDisabled) {
                    card.style.opacity = '0.5';
                    card.style.cursor = 'not-allowed';
                    card.setAttribute('data-disabled', 'true');
                    card.removeAttribute('data-gift-index');
                    if (!card.querySelector('[data-pending]')) {
                        const label = document.createElement('div');
                        label.setAttribute('data-pending', 'true');
                        label.style.cssText = 'font-size: 11px; color: var(--text-light); margin-top: 4px;';
                        label.innerHTML = `<span data-i18n="pending_withdrawal">Pending Withdrawal</span>`;
                        card.appendChild(label);
                    }
                } else if (!isPending && isDisabled) {
                    card.style.opacity = '1';
                    card.style.cursor = 'pointer';
                    card.setAttribute('data-gift-index', giftIndex);
                    card.removeAttribute('data-disabled');
                    const label = card.querySelector('[data-pending]');
                    if (label) label.remove();
                }
            });
            // Re-apply language translations for any newly inserted dynamic labels
            if (typeof applyLanguage === 'function') applyLanguage(document.documentElement.lang || 'ru');
        }

        async function sellAllGifts() {
            if (!currentUserId || !currentInventory || currentInventory.length === 0) {
                showToast('Inventory is empty', 'warning');
                return;
            }

            // Check for pending withdrawals (instance-level or gift-level)
            if ((pendingByIndex && pendingByIndex.size > 0) || (pendingByGiftId && pendingByGiftId.size > 0)) {
                showToast('Cannot sell: you have pending withdrawal requests. Complete or cancel them first.', 'warning');
                return;
            }

            if (!(await window.showConfirm('Sell all ' + currentInventory.length + ' gifts?'))) return;

            const giftIds = currentInventory.map(item => typeof item === 'string' ? item : item.id);
            
            console.log('[FETCH] Selling all gifts:', giftIds);
            fetch(`/api/user/sell-all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, gift_ids: giftIds })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    // choose icon from first inventory item if present
                    let iconSrc = '/static/img/default.png';
                    try {
                        if (currentInventory && currentInventory.length > 0) {
                            const first = currentInventory[0];
                            const img = (typeof first === 'string') ? null : first.image;
                            if (img) iconSrc = img.startsWith('/') ? img : '/static/img/gifts/' + img;
                        }
                    } catch (e) { iconSrc = '/static/img/default.png'; }

                    showToast('Sold! Received ' + (data.total_amount || 0).toFixed(2) + ' TON', 'success', iconSrc);
                    currentInventory = [];
                    loadProfileData();
                    loadPendingWithdrawals();
                } else {
                    showToast(data.error || 'Sale error', 'error');
                }
            })
            .catch(err => showToast(err.message, 'error'));
        }

        document.getElementById('gift-modal').addEventListener('click', (e) => {
            if (e.target.id === 'gift-modal') closeGiftModal();
        });
    </script>
    
    <!-- TonConnect UI Container -->
    <ton-connect-ui></ton-connect-ui>
    
    <!-- Ensure TonConnectUI is loaded -->
    <script>
        // Pre-check that TonConnectUI loaded
        window.addEventListener('load', () => {
            if (typeof TonConnectUI === 'undefined') {
                console.warn('[WARN] TonConnectUI not loaded from unpkg, attempting fallback...');
                // Try alternative CDN
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js';
                script.async = true;
                document.head.appendChild(script);
            } else {
                console.log('[OK] TonConnectUI loaded successfully');
            }
        });
    </script>
    
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
