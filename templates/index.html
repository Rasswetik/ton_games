<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- TOP HEADER С АВАТАРОМ И ИМЕНЕМ -->
        <div class="top-header">
            <div class="header-user-info">
                <div class="header-avatar-container">
                    <svg id="header-avatar-svg" class="header-avatar" viewBox="0 0 24 24" fill="none" stroke="#0088cc" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <img id="header-avatar-img" class="header-avatar" src="" style="display: none;">
                </div>
                <span id="header-username" class="header-username">Пользователь</span>
            </div>
        </div>

<div class="menu-list" style="margin-top: 80px;">
    <a href="#" class="btn-game-large multiplayer">
        <img src="{{ url_for('static', filename='gifs/multi.gif') }}" class="game-gif-large" alt="multi">
        <div class="btn-text-content">
            <span class="btn-title">МУЛЬТИПЛЕЕР</span>
            <span class="btn-subtitle">Играй против людей</span>
        </div>
    </a>

    <a href="{{ url_for('bot') }}" class="btn-game-large bot-game">
        <img src="{{ url_for('static', filename='gifs/bot.gif') }}" class="game-gif-large" alt="bot">
        <div class="btn-text-content">
            <span class="btn-title">БОТ-РЕЖИМ</span>
            <span class="btn-subtitle">Игра с ботом 1х1</span>
        </div>
    </a>
    
    <a href="{{ url_for('admin_panel') }}" class="btn-game-large admin-panel" id="admin-btn" style="display: none;">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#0088cc" stroke-width="2" style="margin: 0 auto; display: block;">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
        </svg>
        <div class="btn-text-content">
            <span class="btn-title">АДМИН ПАНЕЛЬ</span>
            <span class="btn-subtitle">Управление игрой</span>
        </div>
    </a>
</div>

<nav class="bottom-nav">
            <a href="{{ url_for('index') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Главная</span>
            </a>
            <a href="{{ url_for('market') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M3 9H21L19 20H5L3 9Z"></path><path d="M8 9V6C8 4.34315 9.34315 3 11 3H13C14.6569 3 16 4.34315 16 6V9"></path></svg>
                <span>Маркет</span>
            </a>
            <a href="{{ url_for('crafts') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Крафты</span>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            const tgUser = tg.initDataUnsafe?.user;
            
            if (tgUser) {
                const userName = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
                document.getElementById('header-username').textContent = userName;
                
                if (tgUser.photo_url) {
                    document.getElementById('header-avatar-img').src = tgUser.photo_url;
                    document.getElementById('header-avatar-img').style.display = 'block';
                    document.getElementById('header-avatar-svg').style.display = 'none';
                }
                
                // Показать админ панель для нужных пользователей
                const adminIds = [7679909245, 5257227556];
                if (adminIds.includes(tgUser.id)) {
                    document.getElementById('admin-btn').style.display = 'block';
                }
            }
        });
    </script></body>
</html>
