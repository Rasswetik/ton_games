        // Apply theme early to avoid flash-of-incorrect-theme
        try {
            const raw = localStorage.getItem('rps_settings');
            if (raw) {
                const s = JSON.parse(raw);
                if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                else document.documentElement.removeAttribute('data-theme');
            }
        } catch (e) { /* ignore */ }
    </script>

    <script>
        // ===== TOP-UP MODAL FUNCTIONS (INDEX) =====
        let selectedTopupMethod = 'stars';
        let paymentInProgress = false;

        function openTopupModal() {
            if (paymentInProgress) {
                console.log('[UI] Payment in progress, ignoring modal open');
                return;
            }
            document.getElementById('topup-modal').style.display = 'flex';
            document.querySelector('.bottom-nav').style.zIndex = '999';
            selectedTopupMethod = 'stars';
            updateTopupUI();
        }

        function closeTopupModal() {
            if (paymentInProgress) {
                console.log('[UI] Payment in progress, not closing modal');
                return;
            }
            document.getElementById('topup-modal').style.display = 'none';
            document.querySelector('.bottom-nav').style.zIndex = 'auto';
            resetTopupForm();
        }

        function resetTopupForm() {
            selectedTopupMethod = 'stars';
            const tonBtn = document.getElementById('ton-topup-btn');
            const starsBtn = document.getElementById('stars-topup-btn');
            tonBtn.style.background = '#cccccc';
            tonBtn.style.borderColor = '#999999';
            starsBtn.style.background = 'linear-gradient(135deg, #FFD700, rgba(255,215,0,0.2))';
            starsBtn.style.borderColor = '#FFD700';
            document.getElementById('topup-amount-section').style.display = 'none';
            document.getElementById('topup-confirm-btn').style.display = 'none';
            document.getElementById('topup-amount-input').value = '';
        }
        
        function updateTopupUI() {
            const starsBtn = document.getElementById('stars-topup-btn');
            const input = document.getElementById('topup-amount-input');
            
            starsBtn.style.background = 'linear-gradient(135deg, #FFD700, rgba(255,215,0,0.2))';
            starsBtn.style.borderColor = '#FFD700';
            
            input.type = 'number';
            input.step = '1';
            input.min = '1';
            input.value = '';
            input.placeholder = '1';
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            }, { once: true });
            
            document.getElementById('topup-amount-section').style.display = 'block';
            document.getElementById('topup-confirm-btn').style.display = 'block';
        }

        function selectTopupMethod(method) {
            if (method === 'ton') return; // TON disabled
            selectedTopupMethod = method;
            updateTopupUI();
        }

        async function confirmTopup() {
            const amount = document.getElementById('topup-amount-input').value;
            
            if (!amount || parseInt(amount) <= 0) {
                alert('Введите корректную сумму');
                return;
            }
            
            if (selectedTopupMethod === 'stars') {
                await processTopupStars(parseInt(amount));
            }
        }

        async function processTopupStars(amount) {
            if (paymentInProgress) {
                console.warn('[Payment] Payment already in progress');
                return;
            }

            paymentInProgress = true;
            const confirmBtn = document.getElementById('topup-confirm-btn');
            const originalText = confirmBtn.textContent;
            confirmBtn.disabled = true;
            
            try {
                const user_id = window.tgUserId || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || 'anonymous';
                console.log('[Payment] 🔄 Starting payment process for', amount, 'stars, user:', user_id);
                
                confirmBtn.textContent = 'Загрузка платежа...';
                
                // Step 1: Get initial balance
                console.log('[Payment] Step 1: Getting initial balance...');
                let initialBalance = 0;
                try {
                    const balanceResp = await fetch(`/api/user/get?user_id=${user_id}`);
                    const balanceData = await balanceResp.json();
                    if (balanceData.status === 'ok') {
                        initialBalance = parseFloat(balanceData.balance || 0);
                        console.log('[Payment] Initial balance:', initialBalance, 'TON');
                    }
                } catch (e) {
                    console.warn('[Payment] Could not get initial balance:', e);
                }
                
                // Step 2: Create invoice
                console.log('[Payment] Step 2: Creating invoice...');
                const createResponse = await fetch('/api/create-stars-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_id, stars_amount: parseInt(amount) })
                });
                
                if (!createResponse.ok) {
                    throw new Error(`Invoice creation failed: ${createResponse.status}`);
                }
                
                const invoiceData = await createResponse.json();
                console.log('[Payment] Invoice response:', invoiceData);
                
                if (!invoiceData.success) {
                    console.error('[Payment] Invoice creation error:', invoiceData.error);
                    throw new Error(invoiceData.error || 'Failed to create invoice');
                }
                
                if (!invoiceData.invoice_link) {
                    console.error('[Payment] No invoice_link in response');
                    throw new Error('Invoice link not provided by server');
                }
                
                console.log('[Payment] ✅ Invoice created:', invoiceData.invoice_id);
                console.log('[Payment] Invoice link format:', invoiceData.invoice_link.substring(0, 50) + '...');
                confirmBtn.textContent = 'Открываю платёж...';
                
                // Step 3: Open payment
                console.log('[Payment] Step 3: Opening payment window...');
                let paymentComplete = false;
                let callbackReceived = false;
                
                // Start polling - check for balance change
                let pollCount = 0;
                const maxPolls = 60; // 60 seconds (1 minute)
                const pollInterval = setInterval(async () => {
                    if (paymentComplete) {
                        clearInterval(pollInterval);
                        return;
                    }
                    
                    pollCount++;
                    try {
                        const resp = await fetch(`/api/user/get?user_id=${user_id}&t=${Date.now()}`);
                        const data = await resp.json();
                        
                        if (data.status === 'ok' && data.balance !== undefined) {
                            const currentBalance = parseFloat(data.balance);
                            // Log every 5th poll to avoid spam
                            if (pollCount % 5 === 1) {
                                console.log(`[Payment] Poll #${pollCount}: balance = ${currentBalance} TON (initial: ${initialBalance}), diff = ${(currentBalance - initialBalance).toFixed(4)}`);
                            }
                            
                            if (currentBalance > initialBalance + 0.001) {
                                console.log('[Payment] ✅ Balance INCREASED detected! New balance:', currentBalance);
                                paymentComplete = true;
                                clearInterval(pollInterval);
                                
                                // Confirm payment on server
                                await confirmStarsPayment(invoiceData.invoice_id, user_id, amount, currentBalance);
                            }
                        }
                    } catch (e) {
                        console.warn(`[Payment] Poll #${pollCount} error:`, e);
                    }
                    
                    if (pollCount >= maxPolls) {
                        clearInterval(pollInterval);
                        if (!paymentComplete) {
                            console.log('[Payment] ⏱️ Polling timeout after 60 seconds');
                            confirmBtn.textContent = 'Платеж может быть обработан позже';
                            
                            // Offer user to check balance manually
                            setTimeout(() => {
                                confirmBtn.textContent = 'Проверить баланс';
                                confirmBtn.disabled = false;
                                confirmBtn.onclick = async () => {
                                    try {
                                        const resp = await fetch(`/api/user/get?user_id=${user_id}`);
                                        const data = await resp.json();
                                        if (data.status === 'ok') {
                                            const bal = parseFloat(data.balance);
                                            alert(`Ваш текущий баланс: ${bal.toFixed(2)} TON`);
                                            if (bal > initialBalance) {
                                                console.log('[Payment] ✅ Balance increased! Reloading...');
                                                location.reload();
                                            }
                                        }
                                    } catch (e) {
                                        console.error('Error checking balance:', e);
                                        alert('Ошибка проверки баланса');
                                    }
                                };
                            }, 2000);
                        }
                    }
                }, 1000);
                
                // Try to open invoice
                if (window.Telegram?.WebApp?.openInvoice) {
                    console.log('[Payment] Using Telegram WebApp.openInvoice with callback');
                    console.log('[Payment] Invoice link:', invoiceData.invoice_link);
                    console.log('[Payment] Invoice link type:', typeof invoiceData.invoice_link);
                    
                    try {
                        window.Telegram.WebApp.openInvoice(invoiceData.invoice_link, async (status) => {
                            console.log('[Payment] 📱 Telegram callback fired with status:', status);
                            
                            if (status === 'paid') {
                                console.log('[Payment] Status is PAID - confirming immediately...');
                                paymentComplete = true;
                                callbackReceived = true;
                                clearInterval(pollInterval);
                                await confirmStarsPayment(invoiceData.invoice_id, user_id, amount, initialBalance);
                            } else if (status === 'pending') {
                                console.log('[Payment] Status is PENDING - continuing to poll...');
                                // Don't stop polling, payment is still processing
                                // Just update the button to show we're waiting
                                confirmBtn.textContent = 'Платеж обрабатывается...';
                            } else if (status === 'cancelled') {
                                console.log('[Payment] User cancelled payment');
                                callbackReceived = true;
                                clearInterval(pollInterval);
                                alert('❌ Платёж отменён');
                                paymentInProgress = false;
                                confirmBtn.textContent = originalText;
                                confirmBtn.disabled = false;
                            } else if (status === 'failed') {
                                console.log('[Payment] Payment failed');
                                callbackReceived = true;
                                clearInterval(pollInterval);
                                alert('❌ Платёж не прошёл. Попробуйте снова');
                                paymentInProgress = false;
                                confirmBtn.textContent = originalText;
                                confirmBtn.disabled = false;
                            } else {
                                console.log('[Payment] Unknown status:', status);
                            }
                        });
                        console.log('[Payment] ✅ openInvoice called successfully');
                    } catch (e) {
                        console.error('[Payment] ❌ WebApp.openInvoice thrown error:', e);
                        console.error('[Payment] Error type:', e.constructor.name);
                        console.error('[Payment] Error message:', e.message);
                        console.error('[Payment] Error stack:', e.stack);
                        
                        // Don't try fallback, just continue polling
                        console.log('[Payment] Continuing to poll for balance changes...');
                    }
                } else {
                    console.log('[Payment] WebApp.openInvoice not available');
                    console.log('[Payment] window.Telegram:', typeof window.Telegram);
                    console.log('[Payment] window.Telegram.WebApp:', typeof window.Telegram?.WebApp);
                    console.log('[Payment] window.Telegram.WebApp.openInvoice:', typeof window.Telegram?.WebApp?.openInvoice);
                    
                    console.log('[Payment] Fallback: continuing to poll for balance changes...');
                }
                
            } catch (error) {
                console.error('[Payment] Error:', error.message);
                alert('❌ Ошибка платежа:\n' + error.message);
                confirmBtn.textContent = originalText;
                confirmBtn.disabled = false;
                paymentInProgress = false;
            }
        }

        async function confirmStarsPayment(invoice_id, user_id, stars_amount, finalBalance) {
            try {
                console.log('[Confirm] ============================================');
                console.log('[Confirm] Starting payment confirmation...');
                console.log('[Confirm] Parameters:', { invoice_id, user_id, stars_amount });
                console.log('[Confirm] Sending POST to /api/process-stars-payment');
                
                const requestBody = { 
                    user_id: user_id, 
                    invoice_id: invoice_id, 
                    stars_amount: parseInt(stars_amount) 
                };
                console.log('[Confirm] Request body:', requestBody);
                
                const response = await fetch('/api/process-stars-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('[Confirm] Response status:', response.status);
                console.log('[Confirm] Response OK?', response.ok);
                
                if (!response.ok) {
                    console.error('[Confirm] HTTP error: ' + response.status);
                    const errorText = await response.text();
                    console.error('[Confirm] Error response body:', errorText);
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                console.log('[Confirm] Response JSON:', data);
                
                if (data.success) {
                    console.log('[Confirm] ✅ SUCCESS! New balance:', data.new_balance);
                    
                    // Update UI with new balance
                    const headerBalance = document.getElementById('header-balance');
                    if (headerBalance && data.new_balance !== undefined) {
                        const displayBalance = parseFloat(data.new_balance).toFixed(2);
                        headerBalance.textContent = displayBalance + ' TON';
                        console.log('[UI] Updated balance display to:', displayBalance);
                    }
                    
                    // Show success message
                    closeTopupModal();
                    alert(`✅ Спасибо!\n${stars_amount} ⭐ = ${(stars_amount * 0.01).toFixed(4)} TON\n\nВаш баланс пополнен!`);
                    
                    // Reload to refresh all UI
                    console.log('[Confirm] Reloading page in 1.5 seconds...');
                    setTimeout(() => location.reload(), 1500);
                    
                    return { success: true, new_balance: data.new_balance };
                } else {
                    console.error('[Confirm] Server returned success=false');
                    console.error('[Confirm] Error from server:', data.error);
                    
                    // Check if payment was already processed
                    if (data.error && data.error.includes('already')) {
                        console.log('[Confirm] Payment was already processed');
                        alert('✅ Платёж уже обработан! Баланс обновлён.');
                        setTimeout(() => location.reload(), 1500);
                        return { success: true };
                    }
                    
                    alert('❌ ' + (data.error || 'Ошибка при обновлении баланса'));
                    return { success: false, error: data.error };
                }
            } catch (error) {
                console.error('[Confirm] ❌ EXCEPTION:', error);
                console.error('[Confirm] Error message:', error.message);
                console.error('[Confirm] Error stack:', error.stack);
                
                // Network error - don't alert user, just log
                if (error.message.includes('Failed to fetch')) {
                    console.log('[Confirm] Network error detected');
                    alert('⚠️ Сеть недоступна, но платеж может быть обработан. Проверьте баланс позже.');
                    return { success: false, error: error.message };
                }
                
                alert('❌ Ошибка подтверждения: ' + error.message);
                return { success: false, error: error.message };
            } finally {
                console.log('[Confirm] Cleanup: resetting paymentInProgress and button state');
                paymentInProgress = false;
                const confirmBtn = document.getElementById('topup-confirm-btn');
                if (confirmBtn) {
                    confirmBtn.textContent = 'Пополнить баланс';
                    confirmBtn.disabled = false;
                }
                console.log('[Confirm] ============================================');
            }
        }

        // Close modal on outside click
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('topup-modal');
            if (e.target === modal && !paymentInProgress) {
                closeTopupModal();
            }
        });
    </script>
</body>
