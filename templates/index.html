<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="header-main">
            <div class="user-info">
                <img id="tg-avatar" class="avatar-small" src="" alt="" style="display: none;">
                <span id="tg-username" class="username-text">Загрузка...</span>
            </div>
            
            <div id="wallet-connect-block">
                <div id="ton-connect-custom"></div>
            </div>

            <div class="wallet-section" id="wallet-info-block" style="display: none;">
                <div class="balance-badge">
                    <svg class="ton-svg-icon" viewBox="0 0 56 56" fill="none">
                        <path d="M28 56C43.464 56 56 43.464 56 28C56 12.536 43.464 0 28 0C12.536 0 0 12.536 0 28C0 43.464 12.536 56 28 56Z" fill="#0088CC"/>
                        <path d="M13.13 15.31H42.87L28 42.13L13.13 15.31ZM25.35 18.74V34.5L16.48 18.74H25.35ZM30.65 34.5V18.74H39.52L30.65 34.5Z" fill="white"/>
                    </svg>
                    <span id="user-balance">0.0</span>
                </div>
                <button class="deposit-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>

<div class="menu-list">
    <a href="#" class="btn-game-large multiplayer">
        <img src="{{ url_for('static', filename='gifs/multi.gif') }}" class="game-gif-large" alt="multi">
        <div class="btn-text-content">
            <span class="btn-title">МУЛЬТИПЛЕЕР</span>
            <span class="btn-subtitle">Играй против людей</span>
        </div>
    </a>

    <a href="{{ url_for('bot') }}" class="btn-game-large bot-game">
        <img src="{{ url_for('static', filename='gifs/bot.gif') }}" class="game-gif-large" alt="bot">
        <div class="btn-text-content">
            <span class="btn-title">БОТ-РЕЖИМ</span>
            <span class="btn-subtitle">Игра с ботом 1х1</span>
        </div>
    </a>
</div>

<nav class="bottom-nav">
            <a href="{{ url_for('index') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Главная</span>
            </a>
            <a href="{{ url_for('market') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M3 9H21L19 20H5L3 9Z"></path><path d="M8 9V6C8 4.34315 9.34315 3 11 3H13C14.6569 3 16 4.34315 16 6V9"></path></svg>
                <span>Маркет</span>
            </a>
            <a href="{{ url_for('crafts') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Крафты</span>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
