<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крафты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- TOP HEADER -->
        <div class="top-header">
            <div class="header-user-info">
                <div class="header-avatar-container">
                    <svg id="header-avatar-svg" class="header-avatar" viewBox="0 0 24 24" fill="none" stroke="#0088cc" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <img id="header-avatar-img" class="header-avatar" src="" style="display: none;">
                </div>
                <span id="header-username" class="header-username">Пользователь</span>
            </div>
        </div>

        <main class="crafts-container" style="margin-top: 80px; margin-bottom: 80px; padding: 15px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="margin: 0; color: #222;">Крафтинг</h2>
                <p style="color: #999; margin: 5px 0 0 0;">Комбинируйте предметы для новых подарков</p>
            </div>

            <div class="craft-slots" id="craft-slots">
                <div class="craft-slot" id="slot-1"></div>
                <div class="craft-slot" id="slot-2"></div>
                <div class="craft-slot" id="slot-3"></div>
            </div>

            <div class="craft-info" id="craft-info">
                Добавьте предметы (0/3)
            </div>
            
            <button class="btn-craft" id="craft-btn" disabled onclick="doCraft()" style="margin: 15px 0;">КРАФТ</button>

            <h3 style="margin: 25px 0 15px 0; font-weight: 700; color: #222;">Ваш инвентарь</h3>
            <div id="craft-inventory" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;"></div>
        </main>

        <nav class="bottom-nav">
            <a href="{{ url_for('index') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Главная</span>
            </a>
            <a href="{{ url_for('market') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M3 9H21L19 20H5L3 9Z"></path><path d="M8 9V6C8 4.34315 9.34315 3 11 3H13C14.6569 3 16 4.34315 16 6V9"></path></svg>
                <span>Маркет</span>
            </a>
            <a href="{{ url_for('crafts') }}" class="nav-item active">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2" fill="none"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Крафты</span>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <svg class="nav-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        let currentUserId = null;
        let selectedItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            const tgUser = tg.initDataUnsafe?.user;
            
            if (tgUser) {
                currentUserId = tgUser.id;
                const userName = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
                document.getElementById('header-username').textContent = userName;
                
                if (tgUser.photo_url) {
                    document.getElementById('header-avatar-img').src = tgUser.photo_url;
                    document.getElementById('header-avatar-img').style.display = 'block';
                    document.getElementById('header-avatar-svg').style.display = 'none';
                }
            }
            
            loadInventory();
        });

        async function loadInventory() {
            try {
                const response = await fetch(`/api/user/get?user_id=${currentUserId}`);
                const data = await response.json();
                
                if (data.status === 'ok' && data.inventory) {
                    const container = document.getElementById('craft-inventory');
                    container.innerHTML = '';
                    
                    fetch('/static/data/gifts.json')
                        .then(r => r.json())
                        .then(gifts => {
                            data.inventory.forEach(giftId => {
                                const gift = gifts.find(g => g.id === giftId);
                                if (gift) {
                                    const div = document.createElement('div');
                                    div.className = 'craft-item';
                                    div.innerHTML = `<img src="/static/img/gifts/${gift.image}" alt="${gift.name}">`;
                                    div.onclick = () => selectItem(gift);
                                    container.appendChild(div);
                                }
                            });
                        });
                }
            } catch (e) {
                console.error('Error loading inventory:', e);
            }
        }

        function selectItem(gift) {
            if (selectedItems.length < 3) {
                selectedItems.push(gift);
                updateSlots();
            }
        }

        function updateSlots() {
            selectedItems.forEach((item, index) => {
                const slot = document.getElementById(`slot-${index + 1}`);
                slot.innerHTML = `<img src="/static/img/gifts/${item.image}" alt="${item.name}" onclick="removeItem(${index})">`;
            });
            
            for (let i = selectedItems.length; i < 3; i++) {
                document.getElementById(`slot-${i + 1}`).innerHTML = '';
            }
            
            document.getElementById('craft-info').textContent = `Выбрано предметов (${selectedItems.length}/3)`;
            document.getElementById('craft-btn').disabled = selectedItems.length !== 3;
        }

        function removeItem(index) {
            selectedItems.splice(index, 1);
            updateSlots();
        }

        async function doCraft() {
            if (selectedItems.length !== 3) return;
            
            const itemIds = selectedItems.map(item => item.id);
            
            try {
                const response = await fetch(`/api/craft?user_id=${currentUserId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: itemIds })
                });
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    alert('✅ Успешно скрафтено: ' + data.result);
                    selectedItems = [];
                    updateSlots();
                    loadInventory();
                } else {
                    alert('❌ Ошибка: ' + data.error);
                }
            } catch (e) {
                alert('❌ Ошибка крафта');
            }
        }
    </script>

    <style>
        .crafts-container {
            background: white;
        }

        .craft-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .craft-slot {
            aspect-ratio: 1;
            border: 2px dashed #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            overflow: hidden;
        }

        .craft-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        .craft-info {
            text-align: center;
            font-size: 14px;
            color: #666;
            padding: 10px;
            background: #f0f0f5;
            border-radius: 8px;
        }

        .btn-craft {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-craft:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .craft-item {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 2px solid #ddd;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .craft-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .craft-item:active {
            transform: scale(0.95);
        }
    </style>
</body>
</html>
